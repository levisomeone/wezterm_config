add_newline = true
format = """
[╭─](#bb9af7) $directory$git_branch$git_status$python$c$cmd_duration
[╰─](#bb9af7)$character"""

[directory]
style = "bold #7dcfff"
truncation_length = 3
truncation_symbol = "…/"
format = "[\uf07b $path]($style) "

[git_branch]
symbol = "\ue0a0 "
style = "bold #bb9af7"
format = "[$symbol$branch]($style) "

[git_status]
style = "#f7768e"
format = "[$all_status$ahead_behind]($style) "

[python]
symbol = "\ue73c "
style = "#e0af68"
format = "[$symbol$version]($style) "

[c]
symbol = "\ue61e "
style = "#7aa2f7"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "#565f89"
format = "[took $duration]($style)"

[character]
success_symbol = "[λ](bold #9ece6a)"
error_symbol = "[λ](bold #f7768e)"
